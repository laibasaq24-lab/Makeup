<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #1e1e2f;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      background: #15152a;
      display: flex;
      flex-direction: column;
      padding: 0;
      border-right: 1px solid #2a2a45;
      flex-shrink: 0;
    }
    .sidebar .brand {
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #b47fff;
      border-bottom: 1px solid #2a2a45;
      letter-spacing: 1px;
    }
    .sidebar ul {
      list-style: none;
      padding: 10px 0;
      flex: 1;
    }
    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      color: #c0c0d0;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
      border-left: 3px solid transparent;
    }
    .sidebar ul li a:hover,
    .sidebar ul li.active a {
      background: #2a1f45;
      color: #b47fff;
      border-left: 3px solid #8a2be2;
    }
    .sidebar ul li a span.icon { font-size: 1.1rem; }
    .sidebar .signout {
      padding: 15px 20px;
      border-top: 1px solid #2a2a45;
    }
    .sidebar .signout a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ff6b6b;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .sidebar .signout a:hover { color: #ff9999; }

    /* ===== MAIN CONTENT ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Top bar */
    .topbar {
      background: #15152a;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a45;
    }
    .topbar h1 {
      font-size: 1.2rem;
      color: #e0e0e0;
      font-weight: 600;
    }
    .topbar .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #b47fff;
    }
    .topbar .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #8a2be2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 0.9rem;
    }

    /* Page content */
    .content {
      padding: 30px;
      flex: 1;
    }
    .page-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #e0e0e0;
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 0.9rem;
      color: #7a7a9a;
      margin-bottom: 30px;
    }

    /* Summary cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: #15152a;
      border-radius: 12px;
      padding: 22px 20px;
      border: 1px solid #2a2a45;
    }
    .card .card-label {
      font-size: 0.8rem;
      color: #7a7a9a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .card .card-value {
      font-size: 2rem;
      font-weight: bold;
      color: #b47fff;
    }
    .card .card-icon {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    /* Recent section */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #15152a;
      border-radius: 12px;
      overflow: hidden;
    }
    table thead tr { background: #2a1f45; }
    table thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: #b47fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    table tbody tr { border-bottom: 1px solid #2a2a45; }
    table tbody tr:last-child { border-bottom: none; }
    table tbody td {
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #c0c0d0;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.active { background: #1a3a2a; color: #4caf7d; }
    .badge.inactive { background: #3a1a1a; color: #f06060; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <nav class=sidebar>
    <div class=brand>&#128138; MakeupAdmin</div>
    <ul id="navMenu">
      <li class="active"><a href="dashboard.html"><span class="icon">&#127968;</span> Dashboard</a></li>
    </ul>
    <div class=signout>
      <a href=# id=signoutBtn><span class=icon>&#128275;</span> Sign Out</a>
    </div>
  </nav>

  <!-- MAIN -->
  <div class=main>
    <!-- Top bar -->
    <div class=topbar>
      <h1>Dashboard</h1>
      <div class=user-info>
        <div class=avatar id=avatarInitial>A</div>
        <span id=userEmailDisplay>admin@example.com</span>
      </div>
    </div>

    <!-- Content -->
    <div class=content>
      <div class=page-title>Good morning, Admin &#128075;</div>
      <div class=page-subtitle>Here is what is happening in your system today.</div>

      <!-- Summary Cards -->
      <div class=cards>
        <div class=card>
          <div class=card-icon>&#128100;</div>
          <div class=card-label>Total Users</div>
          <div class=card-value id=totalUsers>0</div>
        </div>
        <div class=card>
          <div class=card-icon>&#128722;</div>
          <div class=card-label>Total Vendors</div>
          <div class=card-value id=totalVendors>0</div>
        </div>
        <div class=card>
          <div class=card-icon>&#128220;</div>
          <div class=card-label>Total Orders</div>
          <div class=card-value id=totalOrders>0</div>
        </div>
      </div>

      <!-- Recent Users Table -->
      <div class=section-title>Recent Users</div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id=recentUsersBody>
          <tr><td colspan=4 style=color:#7a7a9a;text-align:center;padding:20px;>No users yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Auth guard
    const loggedIn = localStorage.getItem('loggedInUser');
    if (!loggedIn) { window.location.href = 'login.html'; }

    // Show user info
    const email = loggedIn || '';
    document.getElementById('userEmailDisplay').textContent = email;
    document.getElementById('avatarInitial').textContent = email.charAt(0).toUpperCase();

    // Load summary counts from localStorage
    const users = JSON.parse(localStorage.getItem('users') || '[]');
    document.getElementById('totalUsers').textContent = users.length;
    document.getElementById('totalVendors').textContent = 0;
    document.getElementById('totalOrders').textContent = 0;

    // Recent users table
    if (users.length > 0) {
      const tbody = document.getElementById('recentUsersBody');
      tbody.innerHTML = '';
      users.slice(-5).reverse().forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = 
          <td></td>
          <td></td>
          <td></td>
          <td><span class=badge active>Active</span></td>
        ;
        tbody.appendChild(tr);
      });
    }

    // Sign out
    document.getElementById('signoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('loggedInUser');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
